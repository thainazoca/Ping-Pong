<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping-Pong Simples</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="container">
        <h1>Ping-Pong JS</h1>

        <div class="pontuacao">
            <span id="pontosJogador1">0</span> - <span id="pontosJogador2">0</span>
        </div>

        <div id="campo" class="campo">
            <div id="jogador1" class="raquete"></div>
            <div id="jogador2" class="raquete"></div>
            <div id="bola" class="bola"></div>
        </div>
        
        <p id="mensagem" class="message">Use as setas ↑↓ para a raquete da direita!</p>

        <button id="botaoReiniciar">Reiniciar Jogo</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
